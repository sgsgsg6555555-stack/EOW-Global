<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EOW - 私信</title><link rel="stylesheet" href="style.css?v=mobile1"><style>#messageNotice{display:none!important;margin:0!important;padding:0!important}</style><style>.chat-messages .bubble.mine time{display:flex;align-items:center;justify-content:flex-end;gap:5px}.eow-read-receipt{display:inline-flex;align-items:center;color:#8793a3;flex:none}.eow-read-receipt.is-read{color:#168cff}.eow-read-receipt svg{width:18px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style><style>.chat-messages .bubble{width:fit-content;min-width:0;max-width:78%;box-sizing:border-box}.chat-messages .bubble.mine{margin-left:auto;margin-right:0}.chat-messages .bubble:not(.mine){margin-right:auto}.chat-messages .bubble time{white-space:nowrap;text-align:right}@media(max-width:600px){.chat-messages .bubble{max-width:88%}}</style><style>#chatTitle .eow-chat-call-actions{display:flex;align-items:center;gap:8px;margin:0;padding:0;flex-wrap:nowrap}#chatTitle>a.btn,#chatTitle .eow-chat-call-actions>button.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;min-height:34px;box-sizing:border-box;padding:0 12px;margin:0;line-height:1;white-space:nowrap;vertical-align:middle;align-self:center}#chatTitle{align-items:center}@media(max-width:600px){#chatTitle>a.btn,#chatTitle .eow-chat-call-actions>button.btn{padding:0 7px;font-size:12px}}</style><style>#sendForm{position:relative;display:flex;align-items:center;gap:8px}#messageText{flex:1;min-width:0;width:0}#emojiToggle{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center}#emojiToggle:hover{background:rgba(120,140,180,.15)}#emojiToggle:disabled{opacity:.4;cursor:default}#emojiPanel{position:absolute;bottom:calc(100% + 6px);left:0;width:min(320px,100%);box-sizing:border-box;padding:12px;border:1px solid rgba(128,145,175,.35);border-radius:14px;background:Canvas;color:CanvasText;box-shadow:0 8px 30px #0002;z-index:20}#emojiPanel[hidden]{display:none!important}#emojiGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));max-height:240px;overflow:auto;gap:3px}#emojiGrid button{border:0;background:transparent;border-radius:6px;font-size:23px;min-height:36px;cursor:pointer;padding:0}#emojiGrid button:hover{background:rgba(120,140,180,.2)}@media(prefers-color-scheme:dark){#emojiPanel{color-scheme:dark}}</style></head><body><div id="header"></div><div class="layout"><aside class="side" id="sideNav"></aside><main class="content"><section class="panel"><div class="module-head"><div class="messages-heading"><a class="mobile-page-back" href="feed.html" aria-label="返回首页">‹</a><div><h1 class="section-title">私信</h1><p class="muted">与好友和社区成员进行一对一交流。</p></div></div><button id="refreshMessages" class="btn secondary small">刷新</button></div><div class="message-layout" id="messageLayout"><div class="conversation-list"><div class="conversation-search"><input id="peopleSearch" class="field" placeholder="搜索昵称或用户名…"><button id="searchPeople" class="btn small">搜索</button></div><div id="peopleResults"></div><h3 class="muted" style="font-size:13px;margin:18px 4px 8px">最近联系人</h3><div id="conversations"></div></div><div class="chat-area"><div id="chatTitle" class="chat-title"><strong>选择一位联系人开始聊天</strong></div><div id="chatMessages" class="chat-messages"><div class="empty">你的私信会显示在这里。</div></div><form id="sendForm" class="chat-compose" autocomplete="off"><button type="button" id="emojiToggle" aria-label="选择表情" aria-expanded="false" aria-controls="emojiPanel" disabled><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14c2 3 6 3 8 0M9 9h.01M15 9h.01"/></svg></button><div id="emojiPanel" hidden><strong>常用表情</strong><div id="emojiGrid"></div></div><input class="field" id="messageText" type="text" autocomplete="off" maxlength="4000" placeholder="输入消息…" required disabled><button class="btn" id="sendBtn" disabled>发送</button></form></div></div><div id="messageNotice" hidden></div></section></main></div><script type="module" src="messages.js?v=15"></script><script src="message-emoji.js?v=1" defer></script></body></html>
