<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EOW - 私信</title><link rel="stylesheet" href="style.css?v=mobile1"><style>#messageNotice{display:none!important;margin:0!important;padding:0!important}</style><style>.chat-messages .bubble.mine time{display:flex;align-items:center;justify-content:flex-end;gap:5px}.eow-read-receipt{display:inline-flex;align-items:center;color:#8793a3;flex:none}.eow-read-receipt.is-read{color:#168cff}.eow-read-receipt svg{width:18px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style><style>.chat-messages .bubble{width:fit-content;min-width:0;max-width:78%;box-sizing:border-box}.chat-messages .bubble.mine{margin-left:auto;margin-right:0}.chat-messages .bubble:not(.mine){margin-right:auto}.chat-messages .bubble time{white-space:nowrap;text-align:right}@media(max-width:600px){.chat-messages .bubble{max-width:88%}}</style></head><body><div id="header"></div><div class="layout"><aside class="side" id="sideNav"></aside><main class="content"><section class="panel"><div class="module-head"><div class="messages-heading"><a class="mobile-page-back" href="feed.html" aria-label="返回首页">‹</a><div><h1 class="section-title">私信</h1><p class="muted">与好友和社区成员进行一对一交流。</p></div></div><button id="refreshMessages" class="btn secondary small">刷新</button></div><div class="message-layout" id="messageLayout"><div class="conversation-list"><div class="conversation-search"><input id="peopleSearch" class="field" placeholder="搜索昵称或用户名…"><button id="searchPeople" class="btn small">搜索</button></div><div id="peopleResults"></div><h3 class="muted" style="font-size:13px;margin:18px 4px 8px">最近联系人</h3><div id="conversations"></div></div><div class="chat-area"><div id="chatTitle" class="chat-title"><strong>选择一位联系人开始聊天</strong></div><div id="chatMessages" class="chat-messages"><div class="empty">你的私信会显示在这里。</div></div><form id="sendForm" class="chat-compose" autocomplete="off"><input class="field" id="messageText" type="text" autocomplete="off" maxlength="4000" placeholder="输入消息…" required disabled><button class="btn" id="sendBtn" disabled>发送</button></form></div></div><div id="messageNotice" hidden></div></section></main></div><script type="module" src="messages.js?v=11"></script></body></html>
