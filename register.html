<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOW - 创建账号</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#6558e8 0%,#3db9d3 100%)}
.card{width:100%;max-width:460px;background:#fff;padding:36px 32px;border-radius:24px;box-shadow:0 18px 55px #17245a35}
.logo{text-align:center;font-size:36px;font-weight:800;letter-spacing:2px;color:#6259e8}
h1{text-align:center;color:#20243a;font-size:25px;margin:10px 0}
.sub{text-align:center;color:#78809a;font-size:14px;margin:0 0 25px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;background:#f0f2fa;border-radius:12px;margin-bottom:20px}
.tab{border:0;background:transparent;color:#68718b;padding:11px;border-radius:9px;font-weight:700;cursor:pointer}
.tab.active{background:#fff;color:#5d59e8;box-shadow:0 2px 9px #1c275014}
label{display:block;font-size:14px;font-weight:600;color:#343a52;margin:16px 0 7px}
input{width:100%;padding:14px;border:1px solid #dce1ef;border-radius:11px;font-size:15px;outline:none}
input:focus{border-color:#6a62e9;box-shadow:0 0 0 3px #6a62e91a}
.hint{font-size:12px;color:#858da4;line-height:1.6;margin:7px 0}
.primary{width:100%;border:0;border-radius:11px;padding:15px;margin-top:22px;background:linear-gradient(100deg,#6258e8,#278fef);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.primary:disabled{opacity:.55;cursor:not-allowed}
#message{min-height:22px;margin-top:15px;text-align:center;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.back{text-align:center;margin-top:22px;color:#778099;font-size:14px;line-height:2}
a{color:#5d59e8;text-decoration:none}
.hidden{display:none!important}
.otp-note{background:#f2f5ff;border-radius:10px;padding:10px;color:#566184;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">EOW</div>
  <h1>创建你的账号</h1>
  <p class="sub">加入 EOW，连接彼此，分享生活。</p>

  <div class="tabs" role="tablist" aria-label="注册方式">
    <button class="tab active" id="emailTab" type="button">邮箱注册</button>
    <button class="tab" id="phoneTab" type="button">手机号码注册</button>
  </div>

  <form id="registerForm">
    <section id="emailFields">
      <label for="email">邮箱地址</label>
      <input type="email" id="email" placeholder="请输入你的邮箱" autocomplete="email">
    </section>

    <section id="phoneFields" class="hidden">
      <label for="phone">手机号码（国际格式）</label>
      <input type="tel" id="phone" placeholder="+60123456789" autocomplete="tel" inputmode="tel">
      <p class="hint">请包含国家/地区代码，例如马来西亚 +60、中国 +86。不要输入空格或本地号码前面的 0。</p>
    </section>

    <label for="password">设置密码</label>
    <input type="password" id="password" placeholder="至少输入 8 个字符" minlength="8" autocomplete="new-password" required>

    <label for="confirmPassword">确认密码</label>
    <input type="password" id="confirmPassword" placeholder="请再次输入密码" minlength="8" autocomplete="new-password" required>

    <button class="primary" type="submit" id="registerButton">创建 EOW 账号</button>
  </form>

  <section id="otpSection" class="hidden">
    <div class="otp-note">验证码已请求发送到你的手机。请填写短信中的 6 位验证码完成验证。</div>
    <label for="otp">短信验证码</label>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="输入 6 位验证码">
    <button class="primary" type="button" id="verifyButton">验证手机号并完成注册</button>
    <button class="tab" type="button" id="resendButton" style="width:100%;margin-top:8px">重新发送验证码</button>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
  <div class="back">
    已经有账号？<a href="login.html">立即登录</a><br>
    <a href="index.html">返回 EOW 首页</a>
  </div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://tofnewhidtwkxxzlnyjj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SnsKud9va2jG7fOKZTS-_g_RdP0zmu1";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = id => document.getElementById(id);
const form = $("registerForm"), message = $("message");
let mode = "email";
let pendingPhone = "";

function showMessage(text, color="#d33") {
  message.style.color = color;
  message.textContent = text;
}
function setMode(next) {
  mode = next;
  $("emailFields").classList.toggle("hidden", mode !== "email");
  $("phoneFields").classList.toggle("hidden", mode !== "phone");
  $("emailTab").classList.toggle("active", mode === "email");
  $("phoneTab").classList.toggle("active", mode === "phone");
  $("email").required = mode === "email";
  $("phone").required = mode === "phone";
  $("otpSection").classList.add("hidden");
  form.classList.remove("hidden");
  showMessage("");
}
$("emailTab").addEventListener("click", () => setMode("email"));
$("phoneTab").addEventListener("click", () => setMode("phone"));

function validE164(value) {
  return /^\+[1-9]\d{7,14}$/.test(value);
}
async function requestPhoneOtp(phone, password) {
  const { data, error } = await supabase.auth.signUp({
    phone,
    password,
    options: { channel: "sms" }
  });
  if (error) throw error;
  pendingPhone = phone;

  if (data.session) {
    showMessage("注册成功！正在进入 EOW...", "#16834a");
    window.location.href = "feed.html";
    return;
  }
  form.classList.add("hidden");
  $("otpSection").classList.remove("hidden");
  showMessage("验证码已发送。请查看短信并输入验证码。", "#16834a");
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  const password = $("password").value;
  const confirmPassword = $("confirmPassword").value;
  if (password.length < 8) return showMessage("密码至少需要 8 个字符。");
  if (password !== confirmPassword) return showMessage("两次输入的密码不一致。");

  const button = $("registerButton");
  button.disabled = true;
  button.textContent = mode === "phone" ? "正在发送验证码..." : "正在创建账号...";
  try {
    if (mode === "email") {
      const email = $("email").value.trim();
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: { emailRedirectTo: window.location.origin + "/feed.html" }
      });
      if (error) throw error;
      if (data.session) {
        showMessage("注册成功！正在进入 EOW...", "#16834a");
        window.location.href = "feed.html";
      } else {
        showMessage("注册申请已提交！请检查邮箱并点击验证链接完成注册。", "#16834a");
        form.reset();
      }
    } else {
      const phone = $("phone").value.trim().replace(/[\s()-]/g, "");
      if (!validE164(phone)) throw new Error("手机号格式不正确。请使用国际格式，例如 +60123456789。");
      await requestPhoneOtp(phone, password);
    }
  } catch (error) {
    showMessage("注册失败：" + (error.message || "请稍后重试"));
  } finally {
    button.disabled = false;
    button.textContent = "创建 EOW 账号";
  }
});

$("verifyButton").addEventListener("click", async () => {
  const token = $("otp").value.trim();
  if (!/^\d{6}$/.test(token)) return showMessage("请输入短信中的 6 位验证码。");
  const button = $("verifyButton");
  button.disabled = true;
  button.textContent = "正在验证...";
  try {
    const { error } = await supabase.auth.verifyOtp({
      phone: pendingPhone,
      token,
      type: "sms"
    });
    if (error) throw error;
    showMessage("手机号验证成功！正在进入 EOW...", "#16834a");
    window.location.href = "feed.html";
  } catch (error) {
    showMessage("验证失败：" + (error.message || "验证码无效或已过期"));
  } finally {
    button.disabled = false;
    button.textContent = "验证手机号并完成注册";
  }
});

$("resendButton").addEventListener("click", async () => {
  if (!pendingPhone) return;
  try {
    const { error } = await supabase.auth.resend({ type: "sms", phone: pendingPhone });
    if (error) throw error;
    showMessage("验证码已重新发送，请查看短信。", "#16834a");
  } catch (error) {
    showMessage("重新发送失败：" + (error.message || "请稍后重试"));
  }
});
</script>
</body>
</html>
