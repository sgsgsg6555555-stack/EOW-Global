<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6258e8">
  <meta name="description" content="加入 EOW，连接彼此，分享生活。">
  <title>EOW - 创建账号</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="auth-brand" href="index.html" aria-label="EOW 首页">EOW</a>
      <h1>创建你的账号</h1>
      <p class="muted">加入 EOW，连接彼此，分享生活。</p>
      <div class="auth-switch" role="group" aria-label="注册方式">
        <button class="tab active" id="emailTab" type="button" aria-pressed="true">邮箱注册</button>
        <button class="tab" id="phoneTab" type="button" aria-pressed="false">手机注册</button>
      </div>
      <form id="registerForm" novalidate>
        <section id="emailFields">
          <label for="email">邮箱地址</label>
          <input class="field" type="email" id="email" placeholder="请输入你的邮箱" autocomplete="email" maxlength="254">
        </section>
        <section id="phoneFields" hidden>
          <label for="phone">手机号码（国际格式）</label>
          <input class="field" type="tel" id="phone" placeholder="+60123456789" autocomplete="tel" inputmode="tel">
          <p class="hint">请包含国家/地区代码，例如马来西亚 +60、中国 +86。</p>
        </section>
        <label for="password">设置密码</label>
        <input class="field" type="password" id="password" placeholder="至少输入 8 个字符" minlength="8" maxlength="128" autocomplete="new-password" required>
        <label for="confirmPassword">确认密码</label>
        <input class="field" type="password" id="confirmPassword" placeholder="请再次输入密码" minlength="8" maxlength="128" autocomplete="new-password" required>
        <button class="btn auth-submit" type="submit" id="registerButton">创建 EOW 账号</button>
      </form>
      <section id="otpSection" hidden>
        <p class="notice">验证码已请求发送到你的手机。请填写短信中的 6 位验证码完成验证。</p>
        <label for="otp">短信验证码</label>
        <input class="field" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="输入 6 位验证码">
        <button class="btn auth-submit" type="button" id="verifyButton">验证手机号并完成注册</button>
        <button class="text-button auth-resend" type="button" id="resendButton">重新发送验证码</button>
      </section>
      <div id="message" role="status" aria-live="polite"></div>
      <p class="auth-foot">已经有账号？<a href="login.html">立即登录</a></p>
      <p class="auth-foot"><a href="index.html">返回 EOW 首页</a></p>
    </section>
  </main>
  <script type="module" src="register.js?v=6"></script>
</body>
</html>
