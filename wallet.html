<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOW - 钱包与礼物</title><link rel="stylesheet" href="style.css"><style>
.wallet-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.wallet-balance{background:linear-gradient(120deg,#6078ef,#24b8d1);color:white;border-radius:16px;padding:22px}.wallet-balance strong{font-size:34px;display:block;margin-top:10px}.gift-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.gift-item{border:1px solid #e6ebf4;border-radius:14px;padding:12px}.gift-item img{width:64px;height:64px;object-fit:contain}.gift-item button{width:100%;margin-top:8px}@media(max-width:760px){.wallet-grid{grid-template-columns:1fr}}
</style></head><body><div id="header"></div><div class="layout"><aside class="side" id="sideNav"></aside><main class="content">
<section class="panel"><h1 class="section-title">EOW 钱包与礼物</h1><p class="muted">查看金币余额、交易记录并向其他成员赠送礼物。</p><div class="wallet-grid"><div class="wallet-balance"><span>我的金币余额</span><strong id="coinBalance">—</strong><small>金币仅用于站内礼物功能</small></div><div class="panel"><h3>充值中心（人民币 CNY）</h3><p class="muted">支付渠道尚未完成商户签约及服务端回调配置，暂未开放真实充值。</p><button class="btn secondary" disabled>充值功能准备中</button></div></div></section>
<section class="panel"><h2 class="section-title">礼物商城</h2><div id="giftStatus" class="status">正在加载礼物…</div><div id="giftList" class="gift-list"></div><div id="giftNotice"></div></section>
<section class="panel"><h2 class="section-title">金币流水</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>时间</th><th>类型</th><th>变动</th><th>余额</th><th>说明</th></tr></thead><tbody id="ledgerBody"></tbody></table></div></section>
</main></div><script type="module" src="wallet.js"></script></body></html>
