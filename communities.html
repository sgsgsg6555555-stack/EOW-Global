<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOW - 社区</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><div class="layout"><aside class="side" id="sideNav"></aside><main class="content"><section class="panel"><h1 class="section-title">探索兴趣社区</h1><p class="muted">创建一个话题空间，或加入感兴趣的社区。</p><form id="createCommunity" class="module-tools"><input class="field" id="communityName" maxlength="80" placeholder="社区名称" required><input class="field" id="communityDescription" maxlength="300" placeholder="简单介绍（可选）"><button class="btn">＋ 创建社区</button></form><div id="communityNotice"></div></section><section class="panel"><div class="module-tools"><input id="communitySearch" class="field" placeholder="搜索社区名称或介绍…"><span id="communityStatus" class="muted">正在加载社区…</span></div><div id="communityList" class="community-grid" style="margin-top:16px"></div></section></main></div><script type="module" src="communities.js?v=2"></script></body></html>
