<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOW - 通知中心</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><div class="layout"><aside class="side" id="sideNav"></aside><main class="content"><section class="panel"><div class="module-head"><div><h1 class="section-title">通知中心</h1><p class="muted">好友申请、点赞、评论和私信提醒都会显示在这里。</p></div><button id="markAllRead" class="btn secondary small">全部标为已读</button></div><div class="notice-tabs"><button class="pill-tab active" data-filter="all">全部</button><button class="pill-tab" data-filter="unread">未读 <span id="unreadCount" class="count-pill">0</span></button></div><div id="noticeStatus" class="status">正在加载通知…</div><div id="noticeList"></div></section></main></div><script type="module" src="notifications.js"></script></body></html>
