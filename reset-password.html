<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6258e8">
  <title>EOW - 重置密码</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">EOW</a>
      <h1>设置新密码</h1>
      <p class="muted">请设置一个安全的新密码。</p>
      <form id="resetForm">
        <label for="newPassword">新密码</label>
        <input class="field" id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        <label for="confirmPassword">确认新密码</label>
        <input class="field" id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        <button class="btn auth-submit" id="resetButton" type="submit">更新密码</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <p class="auth-foot"><a href="login.html">返回登录</a></p>
    </section>
  </main>
  <script type="module" src="reset-password.js?v=1"></script>
</body>
</html>
