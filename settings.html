<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#276ef1">
  <title>EOW - 账号与安全设置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <div class="layout">
    <aside class="side" id="sideNav"></aside>
    <main class="content">
      <section class="panel">
        <h1 class="section-title">账号与安全</h1>
        <p class="muted">管理登录邮箱、密码和当前登录会话。</p>
        <div class="settings-account">
          <div class="settings-avatar">E</div>
          <div><strong id="accountEmail">正在读取…</strong><p class="muted" id="accountId"></p></div>
        </div>
      </section>
      <section class="panel">
        <h2 class="section-title">修改登录邮箱</h2>
        <p class="muted">提交后，Supabase 可能会要求你分别确认新旧邮箱。完成验证前，当前邮箱不会立即替换。</p>
        <form id="emailForm" class="settings-form">
          <label for="newEmail">新邮箱地址</label>
          <input class="field" id="newEmail" type="email" autocomplete="email" maxlength="254" required>
          <button class="btn" id="emailButton">提交邮箱变更</button>
        </form>
        <div id="emailNotice" aria-live="polite"></div>
      </section>
      <section class="panel">
        <h2 class="section-title">修改密码</h2>
        <form id="passwordForm" class="settings-form">
          <label for="newPassword">新密码</label>
          <input class="field" id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <label for="confirmPassword">确认新密码</label>
          <input class="field" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <p class="muted">密码至少 8 个字符。请勿重复使用其他网站的密码。</p>
          <button class="btn" id="passwordButton">更新密码</button>
        </form>
        <div id="passwordNotice" aria-live="polite"></div>
      </section>
      <section class="panel">
        <h2 class="section-title">个人资料</h2>
        <p class="muted">头像、昵称、简介和主页封面仍在个人主页中管理。</p>
        <a class="btn secondary" href="profile.html">打开我的个人主页</a>
      </section>
      <section class="panel settings-danger">
        <h2 class="section-title">登录会话</h2>
        <p class="muted">在公共设备上使用后，请退出账号。退出后需要重新登录才能访问 EOW。</p>
        <button class="btn danger" id="signOutButton">退出当前账号</button>
      </section>
    </main>
  </div>
  <script type="module" src="settings.js?v=1"></script>
</body>
</html>
