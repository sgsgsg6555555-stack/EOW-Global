<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6258e8">
  <meta name="description" content="登录 EOW，连接彼此，分享生活。">
  <title>EOW - 登录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="auth-brand" href="index.html" aria-label="EOW 首页">EOW</a>
      <h1>欢迎回来</h1>
      <p class="muted">登录 EOW，连接彼此，分享生活。</p>
      <div class="auth-switch" role="group" aria-label="登录方式">
        <button class="tab active" id="emailTab" type="button" aria-pressed="true">邮箱登录</button>
        <button class="tab" id="phoneTab" type="button" aria-pressed="false">手机登录</button>
      </div>
      <form id="loginForm" novalidate>
        <label id="identifierLabel" for="identifier">邮箱地址</label>
        <input class="field" id="identifier" type="email" autocomplete="username" placeholder="请输入注册邮箱" maxlength="254" required>
        <label for="password">登录密码</label>
        <input class="field" id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="请输入密码" required>
        <div class="auth-inline"><button class="text-button" id="forgotPassword" type="button">忘记密码？</button></div>
        <button class="btn auth-submit" id="loginButton" type="submit">登录 EOW 账号</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <p class="auth-foot">还没有账号？<a href="register.html">立即注册</a></p>
      <p class="auth-foot"><a href="index.html">返回 EOW 首页</a></p>
    </section>
  </main>
  <script type="module" src="login.js?v=6"></script>
</body>
</html>
